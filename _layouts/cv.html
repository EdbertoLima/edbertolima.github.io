---
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }}{% else %}CV{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/cv-screen.css' | relative_url }}">
</head>
<body>
  <nav class="cv-nav">
    <a class="cv-nav-title" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
    <span class="cv-nav-links">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/assets/files/Edberto_Moura_Lima_CV.pdf' | relative_url }}">PDF</a>
    </span>
  </nav>
  <div id="main">
    <div id="content">
    {{ content }}
    </div>
  </div>
</body>
</html>
